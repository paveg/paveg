name: update-svgs

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions: {}

concurrency: update-svgs

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          token: ''
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oss-cards
          path: assets/oss
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oss-cards
          path: ${{ runner.temp }}/cards
      - name: Validate and import cards
        run: |
          stage="$RUNNER_TEMP/cards"
          fail() {
            echo "::error::$*"
            exit 1
          }
          names=$(jq -r '[.[].name] | unique | .[]' config/packages.json)
          [ -n "$names" ] || fail "config/packages.json has no packages"
          expected_count=0
          while IFS= read -r name; do
            [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || fail "unsafe package name: $name"
            expected_count=$((expected_count + 2))
          done <<< "$names"
          if [ -n "$(find "$stage" -mindepth 1 ! -type f -print -quit)" ]; then
            fail "artifact contains non-regular entries (directory or symlink)"
          fi
          while IFS= read -r name; do
            for theme in light dark; do
              file="$name-$theme.svg"
              [ -f "$stage/$file" ] || fail "missing $file"
              [ "$(wc -c < "$stage/$file")" -le 65536 ] || fail "$file is larger than 64 KiB"
              [ "$(head -c 4 "$stage/$file")" = "<svg" ] || fail "$file does not start with <svg"
            done
          done <<< "$names"
          actual_count=$(find "$stage" -mindepth 1 | wc -l)
          if [ "$((actual_count))" -ne "$expected_count" ]; then
            find "$stage" -mindepth 1
            fail "artifact has $((actual_count)) entries, expected $expected_count"
          fi
          mkdir -p assets/oss
          while IFS= read -r name; do
            for theme in light dark; do
              cp -- "$stage/$name-$theme.svg" "assets/oss/$name-$theme.svg"
            done
          done <<< "$names"
      - name: Commit
        id: commit
        run: |
          git add assets/oss
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update README SVGs"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" push origin "HEAD:${GITHUB_REF_NAME}"
